services:
  dsh:
    image: sgccr.ccs.tencentyun.com/misaka-network/deepseek-harness:latest
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      DSH_PORT: "3080"
      # Default working directory shown in the directory picker (defaults to /workspace)
      # DSH_DEFAULT_DIRECTORY: "/workspace"
      # DeepSeek API key (or put it in ./dsh-home/.env)
      # DEEPSEEK_API_KEY: "sk-..."
      # Set to 127.0.0.1 to disable all-interfaces binding (safe mode)
      # DSH_HOST: "127.0.0.1"
      # Trust an access host (LAN IP / domain / reverse-proxy) so /api and
      # plugin routes (/sidebar/*) don't 403 when accessed remotely
      # (space/comma separated; your own LAN IP is auto-trusted).
      # DSH_TRUSTED_HOSTS: "192.168.1.10 dsh.example.com"
      # Disable the trust fence entirely (core /api AND installed plugin
      # routes). No auth layer! Only use behind your own auth/VPN.
      # DSH_DISABLE_TRUST_FENCE: "1"
      # Model-request failure retry count (default 30)
      # DSH_RETRY: "30"
      # Override the User-Agent sent to the model provider
      # UA: "my-custom-agent/1.0"
    volumes:
      # Working directory -- the agent's workspace root (your project files).
      - ./workspace:/workspace
      # dsh home -- profiles/plugins, credentials, config, sessions, storage.
      - ./dsh-home:/root/.dsh
    # For LAN/remote access via a host IP or domain not auto-trusted, either:
    #   - add it to DSH_TRUSTED_HOSTS above, or
    #   - for fully open home-LAN use (no auth layer!) set DSH_DISABLE_TRUST_FENCE=1;
    #     that now also opens plugin routes (/sidebar/*), not just /api.
    # command: ["--trusted-host", "192.168.1.10"]
