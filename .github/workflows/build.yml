name: 检查并构建

on:
  schedule:
    # Daily at 02:00 UTC -- check upstream for a new dsh release tag.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'dsh git ref 构建（如 dsh-v0.1.0-rc.7 / 分支 / commit，留空 = 最新发布标签）'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - '**.md'
      - '.github/**'

permissions:
  contents: write # to commit the updated VERSION file

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  IMAGE: misaka-network/deepseek-harness

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 解析 dsh 版本
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
            case "$RAW" in
              dsh-v*) REF="$RAW"; VER="${RAW#dsh-v}" ;;
              [0-9]*.[0-9]*.*) REF="dsh-v${RAW}"; VER="$RAW" ;;
              *) REF="$RAW"; VER="$RAW" ;;
            esac
          else
            REF="$(git ls-remote --tags https://github.com/deepseek-ai/deepseek-harness.git 'refs/tags/dsh-v*' | sed 's|.*refs/tags/||' | grep -v '\^{}' | sort -V | tail -1)"
            VER="${REF#dsh-v}"
          fi
          if [ -z "$REF" ]; then
            echo "error: no dsh release tag resolved" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved dsh git ref: $REF (version $VER)"

      - name: 判断是否需要构建
        id: check
        run: |
          TARGET="${{ steps.version.outputs.version }}"
          CURRENT="$(cat VERSION 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$TARGET" = "$CURRENT" ]; then
            echo "Up to date at $CURRENT -- nothing to build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $TARGET (current: ${CURRENT:-none})."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云 CCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}

      - name: 构建并推送
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DSH_REF=${{ steps.version.outputs.ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=deepseek-harness
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 记录已构建版本
        if: steps.check.outputs.should_build == 'true'
        run: |
          TARGET="${{ steps.version.outputs.version }}"
          CURRENT="$(cat VERSION 2>/dev/null || true)"
          if [ "$TARGET" != "$CURRENT" ]; then
            printf '%s\n' "$TARGET" > VERSION
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add VERSION
            git commit -m "build: bump dsh to $TARGET" || echo "nothing to commit"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "VERSION already at $TARGET -- nothing to commit."
          fi
